[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simbench"
version = "0.1.0"
description = "SimBench — offline deterministic simulation harness: concurrent scheduler closure assertions + six-engine capability case matrix."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ZONGYUAN-ROOT contributors" }]
keywords = ["simulation", "benchmark", "scheduler", "agent", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["simbench"]
